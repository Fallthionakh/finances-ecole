<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finances – École de Formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10221f; --ink2:#1b3531; --paper:#f5f3ee; --card:#ffffff; --line:#e4e0d6; --muted:#6b7a76;
  --text:#14201d; --accent:#0f766e; --accent-soft:#d8efe9; --in:#15803d; --in-soft:#dcf3e2;
  --out:#c2410c; --out-soft:#fde6da; --warn:#b45309; --warn-soft:#fdf0d3; --danger:#b91c1c;
  --radius:14px; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--ink);color:#e7efec;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#34d399,#0f766e);display:grid;place-items:center;font-weight:800;color:#06201b}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand small{color:#9fb5af;font-size:11.5px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#c9d8d4;text-decoration:none;font-weight:500}
nav a:hover{background:var(--ink2);color:#fff}
nav a.on{background:#e7efec;color:var(--ink);font-weight:700}
nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:11.5px;color:#8ea7a1;padding:8px}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:6px;vertical-align:middle}
.side-foot .dot.ok{background:#34d399}.side-foot .dot.local{background:#fbbf24}
main{padding:26px 30px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cfc9bb}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#0c5f58}
.btn.in{background:var(--in);border-color:var(--in);color:#fff}
.btn.out{background:var(--out);border-color:var(--out);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{margin:0 0 12px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.in .val{color:var(--in)}.kpi.out .val{color:var(--out)}
.cols2{grid-template-columns:1.6fr 1fr}
.cols2b{grid-template-columns:1fr 1fr}
.seg{display:inline-flex;background:#ebe7de;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #f0ede6;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#faf9f6}
.num{text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--in-soft);color:var(--in)}.p-part{background:var(--warn-soft);color:var(--warn)}
.p-no{background:var(--out-soft);color:var(--out)}.p-mute{background:#eeece6;color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.input,select.input,textarea.input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;min-width:0}
.input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.search{flex:1;min-width:200px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.link{color:var(--accent);cursor:pointer;font-weight:600;background:none;border:0;padding:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.bar-track{height:8px;background:#efece5;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.hbar{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.banner{background:var(--warn-soft);color:#7c3d06;border:1px solid #f4d9a4;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(16,34,31,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:780px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:17px}
.mb{padding:20px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#faf9f6;border-radius:0 0 16px 16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#3a4744}
label.f .input{font-weight:400;font-size:14px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:80;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--danger)}
.receipt{border:1px dashed #cfc9bb;border-radius:12px;padding:20px;background:#fffdf8}
.receipt .rh{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.receipt .amt{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--in);margin:12px 0 2px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
.stat-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0ede6}
.stat-line:last-child{border:0}
.stat-line.total{font-weight:800;font-size:15px;border-top:2px solid var(--text);margin-top:4px}
.menu-btn{display:none}
a.btn{text-decoration:none;color:inherit}
.grid>.card{min-width:0}
.kpis6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1100px){.kpis6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.kpis6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#e8e4da;flex:none;display:inline-grid;place-items:center;font-weight:700;font-size:12px;color:#5b6a66;overflow:hidden}
.av.lg{width:96px;height:96px;font-size:28px}
.who{display:flex;gap:10px;align-items:center}
.cni-zone{display:grid;grid-template-columns:1fr 1fr 120px;gap:12px}
.drop{border:1.5px dashed #cfc9bb;border-radius:12px;background:#fbfaf6;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;padding:8px;font-size:12.5px;color:var(--muted);position:relative;overflow:hidden}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop.round{border-radius:50%;width:110px;height:110px;min-height:0;margin:auto}
.drop .lbl{position:relative;z-index:1;background:rgba(255,255,255,.88);padding:2px 8px;border-radius:99px;font-weight:600}
.ocr-status{font-size:12.5px;padding:8px 12px;border-radius:10px;background:#eef6f4;color:#0b4f49;display:none}
.ocr-status.on{display:block}
.ocr-status.err{background:var(--out-soft);color:#7c2d0a}
.filled{background:#e9f7ee!important;border-color:#9ad3ae!important}
.section-t{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.docs-list{display:flex;flex-direction:column;gap:8px}
.doc-item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.doc-item .ic{width:42px;height:42px;border-radius:8px;background:#f1efe9;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);overflow:hidden;flex:none}
.doc-item .ic img{width:100%;height:100%;object-fit:cover}
.dossier-head{display:flex;gap:18px;align-items:center;margin-bottom:16px}
@media (max-width:760px){.cni-zone{grid-template-columns:1fr 1fr}}
body.ro [onclick^="formPaiement"], body.ro [onclick^="formPassage"], body.ro [onclick^="formImport"], body.ro [onclick^="enregistrerDossier"], body.ro [onclick^="formDepense"], body.ro [onclick^="formApprenant"], body.ro [onclick^="formFormation"], body.ro [onclick^="formEtab"], body.ro [onclick^="del"], body.ro [onclick^="submit"]{display:none!important}
.auth{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#10221f,#1b3531 60%,#0f766e);display:grid;place-items:center;padding:20px;overflow-y:auto}
.auth-card{background:#fff;border-radius:18px;width:100%;max-width:400px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth-card h2{margin:6px 0 4px;font-size:20px}
.auth-card form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.auth-card .err{color:var(--danger);font-size:13px;min-height:18px}
.auth-card .ok{color:var(--in);font-size:13px}
.pwd{position:relative;display:block}
.pwd .input{width:100%;padding-right:44px}
.pwd .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;padding:6px;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.pwd .eye:hover{color:var(--text);background:#f1efe9}
.pwd .eye svg{width:20px;height:20px}
.auth-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center}
.user-box{font-size:11.5px;color:#9fb5af;padding:8px;border-top:1px solid #23403b;margin-top:8px}
.user-box b{color:#e7efec;display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.etab-sel{width:100%;margin:0 0 14px;background:var(--ink2);color:#fff;border:1px solid #2f4d48;border-radius:10px;padding:9px 10px;font-weight:600;font-size:13px}
.etab-sel option{color:#111;background:#fff}
.brand .logo img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.etab-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.etab-card{position:relative;overflow:hidden;padding-top:22px}
.etab-card .bar{position:absolute;left:0;right:0;top:0;height:5px}
.etab-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.etab-logo{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;overflow:hidden;flex:none;font-weight:800;color:#fff}
.etab-logo img{width:100%;height:100%;object-fit:contain}
.apercu{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.logo-zone{display:flex;gap:12px;align-items:center}
.logo-prev{width:72px;height:72px;border:1px dashed #cfc9bb;border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden;color:var(--muted);font-size:11px;text-align:center}
.logo-prev img{width:100%;height:100%;object-fit:contain}
textarea.input{resize:vertical;min-height:62px;font-family:inherit}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols2,.cols2b{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;z-index:40;width:250px;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  main{padding:18px 14px 60px}
  .menu-btn{display:inline-flex}
  .fgrid{grid-template-columns:1fr}
  .hbar{grid-template-columns:100px 1fr 90px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand" id="brand"><div class="logo">₣</div><div><b id="schoolName">Mon École</b><small>Gestion financière</small></div></div>
    <div id="etabSelWrap"></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span class="dot" id="dbDot"></span><span id="dbState">Connexion…</span><div id="userBox"></div></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="authRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>
<script>
/* ================== Données & état ================== */
const COLS = ['formations','apprenants','paiements','depenses'];
const RAW = { formations:[], apprenants:[], paiements:[], depenses:[], etablissements:[] };
const S = { formations:[], apprenants:[], paiements:[], depenses:[], etablissements:[],
  settings:{ nom:'Mon École de Formation', adresse:'', telephone:'', email:'', ninea:'' } };
const UI = { period:'mois', q:'', filtreFormation:'', filtreStatut:'', depCat:'', payMode:'',
  rFrom: firstOfMonth(), rTo: today(), etab: (()=>{ try{ return localStorage.getItem('fin_etab')||''; }catch(e){ return ''; } })() };
let db = null, downloads = null, mode = 'loading', canWrite = true;
const IN_CLAUDE = !!(window.claude && window.claude.use);
const CFG = (window.FIN_CONFIG && window.FIN_CONFIG.supabaseUrl && window.FIN_CONFIG.supabaseKey) ? window.FIN_CONFIG : null;
let sb = null; const SB = { user:null, role:null, membres:[], channel:null };
const TBL = c => 'fin_'+c;
const LS_KEY = 'finances_ecole_v1';
let lsOk = false;
function lsLoad(){ try{ const o=JSON.parse(localStorage.getItem(LS_KEY)||'null'); lsOk=true; if(o) [...COLS,'etablissements'].forEach(c=>{ if(Array.isArray(o[c])) RAW[c]=o[c]; }); }catch(e){ lsOk=false; } }
function lsSave(){ if(mode!=='local') return; try{ const o={}; [...COLS,'etablissements'].forEach(c=>o[c]=RAW[c]); localStorage.setItem(LS_KEY, JSON.stringify(o)); lsOk=true; }catch(e){ lsOk=false; toast('Stockage du navigateur plein ou indisponible : faites une sauvegarde.',true); } }
/* Téléchargement direct hors de Claude (GitHub Pages, fichier local…) */
const directDownloads = { save: async ({filename, data}) => {
  const blob = data instanceof Blob ? data : new Blob([data], {type: /\.pdf$/i.test(filename)?'application/pdf':/\.csv$/i.test(filename)?'text/csv':/\.json$/i.test(filename)?'application/json':'application/octet-stream'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  return {status:'saved'}; } };
const loaded = {};

const MODES = ['Espèces','Wave','Orange Money','Free Money','Virement bancaire','Chèque','Carte bancaire'];
const MOTIFS = ['Inscription','Mensualité','Frais de scolarité','Frais d\'examen','Tenue / Kit','Certification','Autre'];
const CATS = ['Salaires formateurs','Salaires personnel','Loyer','Électricité / Eau','Internet / Téléphone','Fournitures pédagogiques','Matériel / Équipement','Maintenance','Marketing / Publicité','Transport','Impôts / Taxes','Frais bancaires','Divers'];
const CAT_COLORS = ['#c2410c','#ea580c','#0f766e','#0891b2','#6366f1','#a16207','#7c3aed','#be185d','#15803d','#475569','#b91c1c','#64748b','#9ca3af'];

/* ================== Utilitaires ================== */
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function firstOfMonth(){ const d=new Date(); return d.toISOString().slice(0,8)+'01'; }
const nf = new Intl.NumberFormat('fr-FR');
const money = n => nf.format(Math.round(+n||0)) + ' F';
const moneyL = n => nf.format(Math.round(+n||0)) + ' FCFA';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate = s => { if(!s) return '—'; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOIS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const uidLocal = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const byId = (col,id) => S[col].find(x=>x.id===id);
const sum = (arr,f) => arr.reduce((s,x)=>s+(+(f?f(x):x)||0),0);

function enLettres(n){
  n = Math.round(Math.abs(+n||0)); if(n===0) return 'zéro';
  const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d=['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const lt100 = n => { if(n<20) return u[n]; const t=Math.floor(n/10), r=n%10;
    if(t===7||t===9) return d[t]+(t===7&&r===1?' et ':'-')+u[10+r];
    let s=d[t]; if(r===1&&t<8) s+=' et un'; else if(r>0) s+='-'+u[r]; else if(t===8) s+='s'; return s; };
  const lt1000 = n => { const c=Math.floor(n/100), r=n%100; let s='';
    if(c>0){ s = c===1?'cent':u[c]+' cent'; if(r===0&&c>1) s+='s'; }
    if(r>0) s+=(s?' ':'')+lt100(r); return s; };
  const mds=Math.floor(n/1e9), mil=Math.floor(n%1e9/1e6), k=Math.floor(n%1e6/1000), r=n%1000, p=[];
  if(mds) p.push(lt1000(mds)+' milliard'+(mds>1?'s':''));
  if(mil) p.push(lt1000(mil)+' million'+(mil>1?'s':''));
  if(k) p.push(k===1?'mille':lt1000(k).replace(/s$/,'')+' mille');
  if(r) p.push(lt1000(r));
  return p.join(' ');
}

/* ================== Établissements ================== */
const etabs = () => S.etablissements;
const defaultEtabId = () => etabs()[0]?.id || '';
const etabById = id => etabs().find(e=>e.id===id);
const etabIdOf = x => (x && x.etablissementId) || defaultEtabId();
function curEtabId(){ if(UI.etab==='*' && etabs().length>1) return '*'; if(etabById(UI.etab)) return UI.etab; return defaultEtabId(); }
const curEtab = () => { const id=curEtabId(); return id==='*' ? null : etabById(id); };
function etabFallback(){ return {nom:S.settings.nom||'Mon École de Formation', adresse:S.settings.adresse, telephone:S.settings.telephone, email:S.settings.email, ninea:S.settings.ninea, couleur:'#0f766e'}; }
function etabFor(x){ return etabById(x ? etabIdOf(x) : (curEtab()?.id||defaultEtabId())) || etabById(defaultEtabId()) || etabFallback(); }
function rescope(){
  S.etablissements = [...RAW.etablissements].sort((a,b)=>(a.creeLe||a.id).localeCompare(b.creeLe||b.id));
  const id=curEtabId();
  COLS.forEach(c=> S[c] = (id==='*' || !etabs().length) ? RAW[c].slice() : RAW[c].filter(x=>etabIdOf(x)===id));
}
function setEtab(v){ UI.etab=v; try{ localStorage.setItem('fin_etab',v); }catch(e){} UI.filtreFormation=''; render(); }
function needEtab(){ if(curEtabId()==='*'){ toast('Choisissez un établissement dans le menu de gauche pour saisir.',true); return false; } return true; }
function etabTag(x){ if(curEtabId()!=='*') return ''; const e=etabById(etabIdOf(x)); return e?` <span class="pill p-acc">${esc(e.code||e.nom)}</span>`:''; }
function initiales(n){ return String(n||'?').split(/\s+/).filter(w=>w.length>2||/^[A-Z]/.test(w)).slice(0,3).map(w=>w[0]).join('').toUpperCase()||'?'; }

/* ================== Calculs ================== */
function scolarite(f){ if(!f) return 0; return (f.mensualite!=null && f.mensualite!=='') ? (+f.mensualite||0)*(+f.mensualites||0) : (+f.fraisScolarite||0); }
function coutFormation(f){ return f ? (+f.fraisInscription||0)+scolarite(f) : 0; }
function mensualiteOf(f){ if(!f) return 0; if(f.mensualite!=null && f.mensualite!=='') return +f.mensualite||0; return f.mensualites ? (+f.fraisScolarite||0)/f.mensualites : 0; }
function formationOf(a){ return byId('formations', a.formationId); }
const NIVEAUX=['1ère année','2e année','3e année','4e année','Formation continue'];
function nomFormation(f){ return f ? (f.nom||'')+(f.niveau?` – ${f.niveau}`:'') : '—'; }
const formationParId = id => RAW.formations.find(x=>x.id===id);
/* Coût d'une inscription (classe actuelle ou passée). fraisInscription peut être écarté (ex. passage sans frais de réinscription) */
function coutInscription(i){ const f=formationParId(i.formationId); if(!f) return 0;
  const ins = i.sansFraisInscription ? 0 : (+f.fraisInscription||0);
  return Math.max(0, ins + scolarite(f) + (+i.fraisAutres||0) - (+i.remise||0)); }
function duHistorique(a){ return sum(a.historique||[], coutInscription); }
function montantDu(a){
  return duHistorique(a) + coutInscription(a);
}
function montantPaye(a){ return sum(S.paiements.filter(p=>p.apprenantId===a.id), p=>p.montant); }
function reste(a){ return Math.max(0, montantDu(a)-montantPaye(a)); }
function statutPaiement(a){
  const du=montantDu(a), p=montantPaye(a);
  if(du>0 && p>=du) return ['Soldé','p-ok'];
  if(p>0) return ['Partiel','p-part'];
  if(du===0) return ['—','p-mute'];
  return ['Non payé','p-no'];
}
function periodRange(per){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0');
  if(per==='mois') return [`${y}-${m}-01`, `${y}-${m}-31`];
  if(per==='annee') return [`${y}-01-01`, `${y}-12-31`];
  return ['0000-01-01','9999-12-31'];
}
const inRange = (date,[a,b]) => date>=a && date<=b;
function apprenantNom(id){ const a=byId('apprenants',id); return a ? `${a.prenom||''} ${a.nom||''}`.trim() : null; }

function setDbState(){
  const dot=document.getElementById('dbDot'), st=document.getElementById('dbState');
  dot.className='dot'+(mode==='db'?' ok':mode==='local'?' local':'');
  if(mode==='sb'){ dot.className='dot ok'; st.textContent='Base en ligne (Supabase)'; renderUserBox(); return; }
  st.textContent = mode==='db' ? 'Données enregistrées' : mode==='local' ? (lsOk?'Données dans ce navigateur':'Mode démo (non enregistré)') : 'Connexion…';
}
let slowTimer;
async function init(){
  if(CFG){ downloads = directDownloads; mode='loading'; render(); await initSupabase(); return; }
  render();
  slowTimer = setTimeout(()=>{ if(mode==='loading'){ UI.slow=true; render(); } }, 10000);
  try{ db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }catch(e){ db=null; }
  try{ downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(e){ downloads=null; }
  try{
    const user = (window.claude && window.claude.use) ? await window.claude.use('user') : null;
    if(user && user.can){ const w = await user.can('data.write'); if(w===false) canWrite=false; }
  }catch(e){}
  if(!downloads && !IN_CLAUDE) downloads = directDownloads;
  if(!db){ mode='local'; lsLoad(); clearTimeout(slowTimer); UI.slow=false; setDbState(); render(); return; }
  mode='db'; setDbState();
  const ALL=[...COLS,'etablissements'];
  ALL.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      RAW[c] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(!snap.metadata.fromCache){ loaded[c]=true; if(ALL.every(k=>loaded[k])){ clearTimeout(slowTimer); UI.slow=false; } }
      schedule();
    }, err=>{ loaded[c]=true; clearTimeout(slowTimer); UI.slow=false; toast('Erreur de chargement : '+(err&&err.code||''),true); schedule(); });
  });
  db.doc('parametres/ecole').onSnapshot(s=>{ if(s.exists) S.settings={...S.settings, ...s.data()}; schedule(); }, ()=>{});
}
let rq=false; function schedule(){ if(rq) return; rq=true; requestAnimationFrame(()=>{ rq=false; render(); }); }

async function saveDoc(col, obj){
  if(!canWrite){ toast('Vous avez un accès en lecture seule.',true); return false; }
  const {id, ...data} = obj;
  const prev = id ? RAW[col].find(x=>x.id===id) : null;
  const out = prev ? {...prev, ...data} : {...data}; delete out.id;
  if(col!=='etablissements' && !out.etablissementId){ const e=curEtabId(); out.etablissementId = (e && e!=='*') ? e : defaultEtabId(); }
  out.majLe = new Date().toISOString();
  try{
    if(mode==='db'){ const ref = id ? db.collection(col).doc(id) : db.collection(col).doc(); await ref.set(out); return ref.id; }
    if(mode==='sb') return await sbSave(col, id, out);
    const nid = id || uidLocal(); const arr=RAW[col]; const i=arr.findIndex(x=>x.id===nid);
    if(i>=0) arr[i]={id:nid,...out}; else arr.push({id:nid,...out}); lsSave(); render(); return nid;
  }catch(e){
    if(e && e.code==='42501'){ toast('Droits insuffisants pour cette opération.',true); }
    else if(e && e.code==='invalid_argument'){ toast('Enregistrement refusé (accès en lecture seule ou document trop volumineux).',true); }
    else if(e && e.code==='quota_exceeded') toast('Capacité de la base atteinte.',true);
    else toast('Échec de l\'enregistrement, réessayez.',true);
    return false;
  }
}
async function deleteDoc(col,id){
  if(!canWrite){ toast('Accès en lecture seule : suppression impossible.',true); return false; }
  try{
    if(mode==='db') await db.collection(col).doc(id).delete();
    else if(mode==='sb'){ const {data,error}=await sb.from(TBL(col)).delete().eq('id',id).select('id'); if(error) throw error;
      if(!data || !data.length){ toast('Suppression refusée : droits insuffisants.',true); return false; }
      RAW[col]=RAW[col].filter(x=>x.id!==id); render(); }
    else { RAW[col]=RAW[col].filter(x=>x.id!==id); lsSave(); render(); }
    return true;
  }catch(e){ toast('Suppression impossible.',true); return false; }
}

function vTableau(){
  const rg = periodRange(UI.period);
  const pays = S.paiements.filter(p=>inRange(p.date,rg)), deps = S.depenses.filter(d=>inRange(d.date,rg));
  const rec = sum(pays,p=>p.montant), dep = sum(deps,d=>d.montant);
  const actifs = S.apprenants.filter(a=>(a.statut||'actif')!=='abandon');
  const attendu = sum(actifs,montantDu), percu = sum(actifs,montantPaye), resteTot = sum(actifs,reste);
  const taux = attendu>0 ? Math.round(percu/attendu*100) : 0;
  const tresor = sum(S.paiements,p=>p.montant) - sum(S.depenses,d=>d.montant);
  const lbl = {mois:'ce mois-ci', annee:'cette année', tout:'depuis le début'}[UI.period];
  const d=new Date(); const sub = `${MOIS_L[d.getMonth()]} ${d.getFullYear()} · ${S.apprenants.length} apprenant(s) · ${S.formations.length} formation(s)`;

  // catégories
  const byCat = {}; deps.forEach(x=>byCat[x.categorie||'Divers']=(byCat[x.categorie||'Divers']||0)+(+x.montant||0));
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const maxCat = cats.length?cats[0][1]:1;

  const impayes = actifs.filter(a=>reste(a)>0).sort((a,b)=>reste(b)-reste(a)).slice(0,6);
  const recents = [...S.paiements.map(p=>({...p,_t:'in'})), ...S.depenses.map(x=>({...x,_t:'out'}))]
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.majLe||'').localeCompare(a.majLe||'')).slice(0,8);

  <div class="row" style="margin-bottom:14px;justify-content:space-between">
    <div class="seg">${[['mois','Ce mois'],['annee','Cette année'],['tout','Tout']].map(([k,l])=>`<button class="${UI.period===k?'on':''}" onclick="UI.period='${k}';render()">${l}</button>`).join('')}</div>
    <span class="muted small">Trésorerie cumulée : <b style="font-family:var(--mono);color:${tresor>=0?'var(--in)':'var(--out)'}">${money(tresor)}</b></span>
  </div>
  <div class="grid kpis">
    <div class="card kpi in"><div class="lbl">Recettes</div><div class="val">${money(rec)}</div><div class="hint">${pays.length} encaissement(s) ${lbl}</div></div>
    <div class="card kpi out"><div class="lbl">Dépenses</div><div class="val">${money(dep)}</div><div class="hint">${deps.length} dépense(s) ${lbl}</div></div>
    <div class="card kpi"><div class="lbl">Résultat net</div><div class="val" style="color:${rec-dep>=0?'var(--in)':'var(--out)'}">${rec-dep>=0?'':'−'}${money(Math.abs(rec-dep))}</div><div class="hint">Recettes − dépenses ${lbl}</div></div>
    <div class="card kpi"><div class="lbl">Reste à recouvrer</div><div class="val" style="color:var(--warn)">${money(resteTot)}</div>
      <div class="hint">Taux de recouvrement ${taux} %</div><div class="bar-track" style="margin-top:8px"><div class="bar-fill" style="width:${taux}%;background:var(--accent)"></div></div></div>
  </div>
  ${curEtabId()==='*' ? parEtabCard(rg,lbl) : ''}

function parEtabCard(rg,lbl){

  ${etabs().map(e=>{ const m=x=>etabIdOf(x)===e.id; const r=sum(S.paiements.filter(p=>m(p)&&inRange(p.date,rg)),p=>p.montant), d=sum(S.depenses.filter(x=>m(x)&&inRange(x.date,rg)),x=>x.montant);

  </tbody></table></div></div>`;

function chartMensuel(){
  const now=new Date(); const months=[];
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push({k:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, l:MOIS[d.getMonth()], r:0, e:0}); }
  const idx=Object.fromEntries(months.map((m,i)=>[m.k,i]));
  S.paiements.forEach(p=>{ const i=idx[(p.date||'').slice(0,7)]; if(i!=null) months[i].r+=+p.montant||0; });
  S.depenses.forEach(p=>{ const i=idx[(p.date||'').slice(0,7)]; if(i!=null) months[i].e+=+p.montant||0; });
  const max=Math.max(1,...months.map(m=>Math.max(m.r,m.e)));
  const W=640,H=220,pl=56,pb=26,pt=10, cw=(W-pl)/12, bw=Math.min(16,cw/3);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  const ticks=[0,.25,.5,.75,1].map(t=>max*t);
  const short=v=> v>=1e6 ? (v/1e6).toFixed(v>=1e7?0:1).replace('.',',')+' M' : v>=1e3 ? Math.round(v/1e3)+' k' : Math.round(v);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Graphique mensuel">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#eeeae2"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="10.5" fill="#8a9592">${short(t)}</text>`).join('')}
    ${months.map((m,i)=>{ const x=pl+i*cw+cw/2;
      return `<g><title>${m.l} : recettes ${money(m.r)} · dépenses ${money(m.e)}</title>
      <rect x="${x-bw-1}" y="${y(m.r)}" width="${bw}" height="${H-pb-y(m.r)}" rx="3" fill="#15803d"/>
      <rect x="${x+1}" y="${y(m.e)}" width="${bw}" height="${H-pb-y(m.e)}" rx="3" fill="#c2410c"/>
      <text x="${x}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#6b7a76">${m.l}</text></g>`; }).join('')}
  </svg>`;
}

/* ---------- Rapports ---------- */
function rapportData(){
  const rg=[UI.rFrom||'0000-01-01', UI.rTo||'9999-12-31'];
  const pays=S.paiements.filter(p=>inRange(p.date,rg)), deps=S.depenses.filter(d=>inRange(d.date,rg));
  const soldeInit = sum(S.paiements.filter(p=>p.date<rg[0]),p=>p.montant) - sum(S.depenses.filter(d=>d.date<rg[0]),d=>d.montant);
  return {rg,pays,deps,soldeInit,rec:sum(pays,p=>p.montant),dep:sum(deps,d=>d.montant)};
}
function groupSum(arr,key){ const o={}; arr.forEach(x=>{ const k=typeof key==='function'?key(x):(x[key]||'—'); o[k]=(o[k]||0)+(+x.montant||0); }); return Object.entries(o).sort((a,b)=>b[1]-a[1]); }
function vRapports(){
  const R=rapportData();
  const parMotif=groupSum(R.pays,'motif'), parMode=groupSum(R.pays,'mode'), parCat=groupSum(R.deps,'categorie');
  const parForm=groupSum(R.pays, p=>{ const a=byId('apprenants',p.apprenantId); return a?(nomFormation(formationOf(a))||'Sans formation'):'Recettes diverses'; });
  const journal=[...R.pays.map(p=>({date:p.date,lib:`${p.motif} — ${apprenantNom(p.apprenantId)||p.payeur||'Recette diverse'}`,ref:p.numero,in:+p.montant||0,out:0,t:p.majLe||''})),
                 ...R.deps.map(d=>({date:d.date,lib:[d.categorie, d.beneficiaire||d.description].filter(Boolean).join(' — '),ref:d.reference||'',in:0,out:+d.montant||0,t:d.majLe||''}))]
    .sort((a,b)=>a.date.localeCompare(b.date)||a.t.localeCompare(b.t));
  let solde=R.soldeInit;
  const block=(title,rows,color)=>`<div class="card"><h3>${title}</h3>${rows.length?rows.map(([k,v])=>`<div class="stat-line"><span>${esc(k)}</span><span class="num" style="color:${color}">${money(v)}</span></div>`).join(''):'<div class="muted small">Aucune donnée sur la période.</div>'}</div>`;
  const allDates=[...S.paiements,...S.depenses].map(x=>x.date).filter(Boolean).sort();
  const presets=[['Ce mois',firstOfMonth(),today()],['Mois dernier',...lastMonth()],['Cette année',new Date().getFullYear()+'-01-01',today()],['Depuis le début',allDates[0]||firstOfMonth(),today()>(allDates.at(-1)||'')?today():allDates.at(-1)]];
  const horsPeriode=[...S.paiements,...S.depenses].filter(x=>!inRange(x.date,R.rg)).length;
  const avis = horsPeriode ? `<div class="banner" style="margin:12px 0 0">${R.pays.length+R.deps.length?'':'Aucune opération sur cette période. '}${horsPeriode} opération(s) enregistrée(s) en dehors de la période choisie (du ${fdate(allDates[0])} au ${fdate(allDates.at(-1))}). <button class="link" onclick="UI.rFrom='${allDates[0]}';UI.rTo='${today()>(allDates.at(-1)||'')?today():allDates.at(-1)}';render()">Tout afficher</button></div>` : '';
  return header('Rapports financiers', `Période du ${fdate(R.rg[0])} au ${fdate(R.rg[1])}`,
    `<button class="btn" onclick="exportJournal()">Exporter le journal (CSV)</button><button class="btn pri" onclick="pdfRapport()">Télécharger le rapport (PDF)</button>`) + `
  <div class="card" style="margin-bottom:16px"><div class="row">
    <label class="f" style="flex-direction:row;align-items:center;gap:8px">Du <input type="date" class="input" value="${UI.rFrom}" onchange="UI.rFrom=this.value;render()"></label>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px">au <input type="date" class="input" value="${UI.rTo}" onchange="UI.rTo=this.value;render()"></label>
    ${presets.map(([l,a,b])=>`<button class="btn sm" onclick="UI.rFrom='${a}';UI.rTo='${b}';render()">${l}</button>`).join('')}
  </div>${avis}</div>
  <div class="grid cols2b">
    <div class="card"><h3>Compte de résultat</h3>
      <div class="stat-line"><span>Solde de trésorerie en début de période</span><span class="num">${money(R.soldeInit)}</span></div>
      <div class="stat-line"><span>Total des recettes</span><span class="num" style="color:var(--in)">+ ${money(R.rec)}</span></div>
      <div class="stat-line"><span>Total des dépenses</span><span class="num" style="color:var(--out)">− ${money(R.dep)}</span></div>
      <div class="stat-line"><span><b>Résultat de la période</b></span><span class="num" style="font-weight:700;color:${R.rec-R.dep>=0?'var(--in)':'var(--out)'}">${money(R.rec-R.dep)}</span></div>
      <div class="stat-line total"><span>Solde de trésorerie en fin de période</span><span class="num">${money(R.soldeInit+R.rec-R.dep)}</span></div>
    </div>
    ${curEtabId()==='*'?block('Recettes par établissement',groupSum(R.pays,p=>etabById(etabIdOf(p))?.nom||'—'),'var(--in)')+block('Dépenses par établissement',groupSum(R.deps,d=>etabById(etabIdOf(d))?.nom||'—'),'var(--out)'):''}
    ${block('Recettes par formation',parForm,'var(--in)')}
    ${block('Recettes par motif',parMotif,'var(--in)')}
    ${block('Recettes par mode de paiement',parMode,'var(--in)')}
    ${block('Dépenses par catégorie',parCat,'var(--out)')}
    ${situationRecouvrement()}
  </div>
  <div class="card" style="margin-top:16px"><h3>Journal de caisse <span class="muted small">${journal.length} opération(s)</span></h3>
    ${journal.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Libellé</th><th>Réf.</th><th class="num">Entrée</th><th class="num">Sortie</th><th class="num">Solde</th></tr></thead><tbody>
    <tr><td></td><td class="muted">Solde initial</td><td></td><td></td><td></td><td class="num">${money(R.soldeInit)}</td></tr>
    ${journal.map(j=>{ solde+=j.in-j.out; return `<tr><td>${fdate(j.date)}</td><td>${esc(j.lib)}</td><td class="muted small" style="font-family:var(--mono)">${esc(j.ref)}</td><td class="num" style="color:var(--in)">${j.in?money(j.in):''}</td><td class="num" style="color:var(--out)">${j.out?money(j.out):''}</td><td class="num">${money(solde)}</td></tr>`; }).join('')}
    </tbody><tfoot><tr><th colspan="3">Totaux</th><th class="num">${money(R.rec)}</th><th class="num">${money(R.dep)}</th><th class="num">${money(solde)}</th></tr></tfoot></table></div>`:'<div class="empty">Aucune opération sur la période.</div>'}
  </div>`;
}
function situationRecouvrement(){
  const actifs=S.apprenants.filter(a=>a.statut!=='abandon');
  const du=sum(actifs,montantDu), p=sum(actifs,montantPaye), r=sum(actifs,reste);
  const n={ok:0,part:0,no:0}; actifs.forEach(a=>{ const s=statutPaiement(a)[1]; if(s==='p-ok')n.ok++; else if(s==='p-part')n.part++; else if(s==='p-no')n.no++; });
  return `<div class="card"><h3>Situation du recouvrement <span class="muted small">à ce jour</span></h3>
    <div class="stat-line"><span>Montant total attendu</span><span class="num">${money(du)}</span></div>
    <div class="stat-line"><span>Montant encaissé</span><span class="num" style="color:var(--in)">${money(p)}</span></div>
    <div class="stat-line"><span>Reste à recouvrer</span><span class="num" style="color:var(--out)">${money(r)}</span></div>
    <div class="stat-line"><span>Taux de recouvrement</span><span class="num">${du?Math.round(p/du*100):0} %</span></div>
    <div class="row" style="margin-top:10px"><span class="pill p-ok">${n.ok} soldé(s)</span><span class="pill p-part">${n.part} partiel(s)</span><span class="pill p-no">${n.no} non payé(s)</span></div></div>`;
}
function lastMonth(){ const d=new Date(); const a=new Date(d.getFullYear(),d.getMonth()-1,1), b=new Date(d.getFullYear(),d.getMonth(),0);
  const f=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; return [f(a),f(b)]; }

async function lireLogo(input){
  const f=input.files&&input.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ toast('Choisissez une image (PNG, JPG ou SVG).',true); return; }
  try{
    const url=await new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=ko; r.readAsDataURL(f); });
    const img=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
    const iw=img.naturalWidth||img.width||300, ih=img.naturalHeight||img.height||300;
    const k=Math.min(1,400/Math.max(iw,ih)), w=Math.max(1,Math.round(iw*k)), h=Math.max(1,Math.round(ih*k));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.drawImage(img,0,0,w,h);
    let data=cv.toDataURL('image/png');
    if(data.length>160000){ const c2=document.createElement('canvas'); c2.width=w; c2.height=h; const x2=c2.getContext('2d'); x2.fillStyle='#fff'; x2.fillRect(0,0,w,h); x2.drawImage(img,0,0,w,h); data=c2.toDataURL('image/jpeg',.88); }
    EDIT.logo=data; EDIT.logoW=w; EDIT.logoH=h; majApercu();
  }catch(e){ toast('Impossible de lire cette image.',true); }
  input.value='';
}

/* ---- Lecture automatique de la carte (OCR dans le navigateur, aucune donnée envoyée) ---- */
let tessP=null;
function chargerTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(!tessP) tessP=addScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js').catch(e=>{ tessP=null; throw e; });
  return tessP;
}
async function imageVersCanvas(file, cible=1800){
  const url=URL.createObjectURL(file);
  const img=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
  const k=cible/Math.max(img.naturalWidth,img.naturalHeight); const w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h), p=d.data; let mn=255,mx=0;
  for(let i=0;i<p.length;i+=4){ const g=.299*p[i]+.587*p[i+1]+.114*p[i+2]; p[i]=p[i+1]=p[i+2]=g; if(g<mn)mn=g; if(g>mx)mx=g; }
  const r=Math.max(1,mx-mn); for(let i=0;i<p.length;i+=4){ const v=(p[i]-mn)*255/r; p[i]=p[i+1]=p[i+2]=v; }
  x.putImageData(d,0,0); URL.revokeObjectURL(url); return c;
}
async function ocrTexte(canvas, lang, params){

const versChiffres = s => s.replace(/O|Q|D/g,'0').replace(/[IL]/g,'1').replace(/Z/g,'2').replace(/S/g,'5').replace(/B/g,'8').replace(/G/g,'6').replace(/T/g,'7');
const versLettres = s => s.replace(/0/g,'O').replace(/1/g,'I').replace(/5/g,'S').replace(/8/g,'B').replace(/2/g,'Z').replace(/6/g,'G');
function lireMRZ(texte){
  const lignes=texte.toUpperCase().split(/\n/).map(l=>l.replace(/\s+/g,'').replace(/[«‹(\[{]/g,'<').replace(/[^A-Z0-9<]/g,'')).filter(l=>l.length>=18);
  let i2=-1;
  for(let i=0;i<lignes.length;i++){ const l=lignes[i]; if(/^\d{7}[MF<]/.test(versChiffres(l.slice(0,7))+l[7])){ i2=i; break; } }
  if(i2<0) return null;
  const l1=lignes[i2-1]||'', l2=lignes[i2], l3=lignes[i2+1]||'';
  const res={};
  const dn=versChiffres(l2.slice(0,6));
  if(/^\d{6}$/.test(dn)){ const yy=+dn.slice(0,2), mm=+dn.slice(2,4), jj=+dn.slice(4,6); const cur=new Date().getFullYear()%100;
    if(mm>=1&&mm<=12&&jj>=1&&jj<=31) res.dateNaissance=`${yy>cur?1900+yy:2000+yy}-${dn.slice(2,4)}-${dn.slice(4,6)}`; }
  if(l2[7]==='M'||l2[7]==='F') res.sexe=l2[7];
  const nat=versLettres(l2.slice(15,18)).replace(/[^A-Z]/g,''); if(nat.length===3) res.nationalite=nat;
  if(/^[IAC]/.test(l1)){ let num=l1.slice(5,14).replace(/</g,''); if(/^\d+$/.test(versChiffres(num))) num=versChiffres(num); if(num.length>=6) res.numeroCarte=num;
    const opt=versChiffres(l1.slice(15)).replace(/[^0-9]/g,''); if(opt.length>=13) res.nin=opt.slice(0,13); }
  if(l3.includes('<<')){ const parts=l3.replace(/<+$/,'').split('<<');
    const nom=versLettres(parts[0]||'').replace(/</g,' ').trim(); const pre=versLettres(parts[1]||'').replace(/</g,' ').trim();
    if(nom) res.nom=nom; if(pre) res.prenom=pre; }
  return Object.keys(res).length?res:null;
}
function lireRecto(texte){
  const res={}; const lignes=texte.split('\n').map(x=>x.trim()).filter(Boolean);
  const plat=texte.replace(/[Oo](?=\d)|(?<=\d)[Oo]/g,'0');
  const nin=plat.match(/(?<!\d)\d(?:[ .]?\d){12}(?!\d)/); if(nin) res.nin=nin[0].replace(/\D/g,'');
  const d=texte.match(/(\d{2})[\/.\-](\d{2})[\/.\-]((?:19|20)\d{2})/); if(d) res.dateNaissance=`${d[3]}-${d[2]}-${d[1]}`;
  const valeurApres=(re)=>{ for(let i=0;i<lignes.length;i++){ const m=re.exec(lignes[i]); if(m){ let v=(lignes[i].slice(m.index+m[0].length)||'').replace(/^[\s:.\-]+/,'').trim(); if(v.replace(/[^A-Za-zÀ-ÿ]/g,'').length<2) v=lignes[i+1]||''; return v; } } return ''; };
  const propre=v=>v.replace(/\d{2}[\/.\-]\d{2}[\/.\-]\d{4}/g,'').replace(/[^A-Za-zÀ-ÿ' \-]/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
  const lieu=propre(valeurApres(/lieu\s*de\s*naissance/i)); if(lieu.length>=2) res.lieuNaissance=lieu;
  const pre=propre(valeurApres(/pr[ée]noms?/i)); if(pre.length>=2) res.prenom=pre;
  const nom=propre(valeurApres(/^\s*nom\b/i)); if(nom.length>=2) res.nom=nom;
  const sx=/sexe\s*[:\-]?\s*([MF])\b/i.exec(texte); if(sx) res.sexe=sx[1].toUpperCase();
  return res;
}
const LECTURE={recto:null, verso:null};
async function lireCarte(face, file){
  ocrStatus(`Lecture du ${face} de la carte… (la première fois, le chargement peut prendre 20 à 30 secondes)`);
  try{
    await chargerTesseract();
    if(face==='verso'){
      const c=await imageVersCanvas(file, 2000);
      const t=await ocrTexte(c,'eng',{tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<'});
      LECTURE.verso=lireMRZ(t);
      if(!LECTURE.verso){ ocrStatus('Les lignes « &lt;&lt;&lt; » du verso n\'ont pas pu être lues. Reprenez une photo nette, bien à plat, sans reflet — ou remplissez les champs à la main.', true); return; }
    } else {
      const c=await imageVersCanvas(file, 1800);
      LECTURE.recto=lireRecto(await ocrTexte(c,'fra'));
    }
    appliquerLecture();
  }catch(e){ console.error(e); ocrStatus('Lecture automatique indisponible (connexion internet requise pour le module de lecture). Remplissez les champs à la main.', true); }
}
function appliquerLecture(){

  const val={ nom:v.nom||r.nom, prenom:v.prenom||r.prenom, dateNaissance:v.dateNaissance||r.dateNaissance, sexe:v.sexe||r.sexe,
    lieuNaissance:r.lieuNaissance, numeroPiece:r.nin||v.nin||v.numeroCarte, nationalite:v.nationalite };
  const remplis=[];
  for(const [k,x] of Object.entries(val)){ if(!x||!fm[k]) continue; fm[k].value=x; fm[k].classList.add('filled'); remplis.push(k); }
  const noms={nom:'nom',prenom:'prénom',dateNaissance:'date de naissance',sexe:'sexe',lieuNaissance:'lieu de naissance',numeroPiece:'n° de pièce',nationalite:'nationalité'};
  const manque=['nom','prenom','dateNaissance','lieuNaissance','numeroPiece','sexe'].filter(k=>!remplis.includes(k));
  ocrStatus(`<b>${remplis.length} champ(s) rempli(s) depuis la carte</b> (en vert) : vérifiez-les avant d'enregistrer.${manque.length?`<br>À compléter : ${manque.map(k=>noms[k]).join(', ')}${!LECTURE.recto&&manque.includes('lieuNaissance')?' — ajoutez le recto pour le lieu de naissance':''}${!LECTURE.verso?' — ajoutez le verso pour une lecture plus fiable':''}.`:''}`);
}

function echeancierData(a){
  const f=formationOf(a); const m=mensualiteOf(f), n=+f?.mensualites||0; if(!f||!m||!n) return null;
  let dispo=montantPaye(a)-duHistorique(a)-(a.sansFraisInscription?0:(+f.fraisInscription||0))-(+a.fraisAutres||0);
  const insOk = dispo>=0; dispo=Math.max(0,dispo);
  let restantScol=Math.max(0,m*n-(+a.remise||0)), rows=[], regles=0;
  for(let i=1;i<=n;i++){
    const du_i=Math.min(m,restantScol); restantScol-=du_i;
    const paye_i=Math.min(du_i,dispo); dispo-=paye_i;
    const ok = du_i===0||paye_i>=du_i; if(ok) regles++;
    rows.push({i, du:du_i, paye:paye_i, st: ok?'ok':paye_i>0?'part':'no'});
  }
  return {m,n,rows,regles,insOk};
}
function echeancier(a){

}

async function validerPassage(ids){

function anneeScolaire(d){ if(!d) return 'Sans date'; const y=+d.slice(0,4), m=+d.slice(5,7); const s=m>=9?y:y-1; return `${s}-${s+1}`; }
const TYPES_ENTREE={ 'Inscription':'p-acc', 'Passage en classe supérieure':'p-ok', 'Redoublement':'p-part', 'Changement de filière':'p-mute', 'Réorientation':'p-mute', 'Réintégration':'p-acc', 'Autre':'p-mute' };
function cursusEntries(a){
  const h=a.historique||[];
  const all=[...h.map(x=>({...x, enCours:false})), {formationId:a.formationId, dateInscription:a.dateInscription, dateFin:'', matricule:a.matricule, fraisAutres:a.fraisAutres, remise:a.remise, sansFraisInscription:a.sansFraisInscription, enCours:true, statut:a.statut||'actif'}];
  return all.map((e,i)=>{
    let entree = i===0 ? 'Inscription' : (h[i-1]?.motifSortie || 'Passage en classe supérieure');
    if(i>0 && all[i-1].formationId===e.formationId) entree='Redoublement';
    const sortie = e.enCours ? ({actif:'En cours',termine:'Terminé',abandon:'Abandon'}[e.statut]||'En cours') : (h[i]?.motifSortie||'');

const BUCKET='fin-dossiers';
const URLS=new Map(); // chemin -> {url, exp}
async function urlsSignees(paths){
  if(mode!=='sb' || !paths.length) return {};
  const now=Date.now(), manque=[...new Set(paths)].filter(p=>!(URLS.get(p)?.exp>now));
  if(manque.length){ const { data } = await sb.storage.from(BUCKET).createSignedUrls(manque, 3600);
    (data||[]).forEach(x=>{ if(x.signedUrl) URLS.set(x.path, {url:x.signedUrl, exp:now+50*60*1000}); }); }
  const out={}; paths.forEach(p=>{ const u=URLS.get(p); if(u) out[p]=u.url; }); return out;
}
async function hydraterImages(){
  if(mode!=='sb') return;
  const imgs=[...document.querySelectorAll('img[data-path]:not([src])')], links=[...document.querySelectorAll('a[data-href-path]:not([href])')];
  const paths=[...imgs.map(i=>i.dataset.path), ...links.map(l=>l.dataset.hrefPath)]; if(!paths.length) return;
  try{ const u=await urlsSignees(paths); imgs.forEach(i=>{ if(u[i.dataset.path]) i.src=u[i.dataset.path]; }); links.forEach(l=>{ if(u[l.dataset.hrefPath]) l.href=u[l.dataset.hrefPath]; }); }catch(e){}
}
function avatar(a, taille=''){

async function compresserImage(file, max=1600, q=.85){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',q)); } finally{ URL.revokeObjectURL(url); }
}
async function envoyerFichier(a, file, categorie, maxImg=1600){
  if(mode!=='sb') throw new Error('Disponible uniquement dans la version en ligne');
  let blob=file, type=file.type||'application/octet-stream', nom=file.name||'document';
  if(/^image\//.test(type) && !/svg|gif/.test(type)){ blob=await compresserImage(file, maxImg); type='image/jpeg'; nom=nom.replace(/\.[^.]+$/,'')+'.jpg'; }
  if(blob.size>10*1024*1024) throw new Error(`${nom} dépasse 10 Mo`);
  const sur=nom.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);
  const path=`${etabIdOf(a)}/${a.id}/${Date.now()}_${sur}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:type, upsert:false });
  if(error) throw error;
  return { path, nom, type, taille:blob.size, categorie, ajouteLe:new Date().toISOString() };
}

/* Paiement */
function codeEtab(e){ return String(e?.code||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
const MOTS_VIDES=['DE','DU','DES','D','LA','LE','LES','L','ET','EN','A','AU','AUX','POUR','SUR'];
function initialesFormation(nom){
  const mots=String(nom||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  const utiles=mots.filter(w=>!MOTS_VIDES.includes(w));
  return (utiles.length?utiles:mots).map(w=>w[0]).join('').slice(0,8);
}
function sigleFormation(f){ const s=String(f?.sigle||'').toUpperCase().replace(/[^A-Z0-9]/g,''); return s || initialesFormation(f?.nom); }
function seqNumero(n){ const m=/(\d+)$/.exec(n||''); return m?parseInt(m[1],10):0; }
function maxSeq(etabId){ return Math.max(0,...RAW.paiements.filter(p=>etabIdOf(p)===etabId).map(p=>seqNumero(p.numero))); }
/* N° de reçu : SIGLEÉTAB_SIGLEFORMATION_NNNN — numéro d'ordre continu sur tous les reçus de l'établissement */
function prefixeRecu(etabId, apprenantId){
  const code=codeEtab(etabById(etabId))||'REC';
  const a=apprenantId?byId('apprenants',apprenantId)||RAW.apprenants.find(x=>x.id===apprenantId):null;
  const f=a?RAW.formations.find(x=>x.id===a.formationId):null;
  const sf=f?sigleFormation(f):'DIV';
  return `${code}_${sf}_`;
}
function nouveauNumero(date, etabId, apprenantId){
  return prefixeRecu(etabId, apprenantId)+String(maxSeq(etabId)+1).padStart(4,'0');

let pdfLibP=null;
function loadPdfLib(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return Promise.resolve();
  if(pdfLibP) return pdfLibP;
  const add=src=>new Promise((ok,ko)=>{ const t=document.createElement('script'); t.src=src; t.onload=ok; t.onerror=()=>ko(new Error('load '+src)); document.head.appendChild(t); });
  pdfLibP = add('lib/jspdf.umd.min.js').then(()=>add('lib/jspdf.plugin.autotable.min.js')).catch(e=>{ pdfLibP=null; throw e; });
  return pdfLibP;
}
const T = v => String(v??'').replace(/[   ]/g,' ').replace(/−/g,'-').replace(/[‘’]/g,"'");
const pm = n => T(nf.format(Math.round(+n||0)))+' FCFA';
const pmS = n => T(nf.format(Math.round(+n||0)));
const C = { ink:[16,34,31], acc:[15,118,110], inn:[21,128,61], out:[194,65,12], mut:[107,122,118], line:[220,215,205], soft:[240,248,245] };
async function newPdf(orientation='p'){
  await loadPdfLib();
  const doc = new window.jspdf.jsPDF({orientation, unit:'mm', format:'a4'});
  doc.setFont('helvetica','normal'); return doc;
}
let ACC=C.acc;
function hexRgb(h){ const m=/^#?([0-9a-f]{6})$/i.exec(h||''); if(!m) return C.acc.slice(); const n=parseInt(m[1],16); return [n>>16&255,n>>8&255,n&255]; }
function imgFmt(u){ return /^data:image\/jpe?g/i.test(u)?'JPEG':'PNG'; }
/* Identité (logo + nom + en-tête + coordonnées). Retourne le bas du bloc. */
function drawIdent(doc,E,x,y,maxW,o={}){
  let tx=x, bottom=y;
  if(E.logo){ try{ const r=(E.logoW&&E.logoH)?E.logoW/E.logoH:1; let h=o.logoH||20, w=h*r; if(w>(o.logoMaxW||38)){ w=o.logoMaxW||38; h=w/r; }
    doc.addImage(E.logo, imgFmt(E.logo), x, y-4.5, w, h); tx=x+w+4; maxW-=w+4; bottom=y-4.5+h; }catch(e){ console.warn(e); } }
  const ns=o.nameSize||14; let ty=y+1;
  doc.setTextColor(...C.ink); doc.setFont('helvetica','bold'); doc.setFontSize(ns);
  const nl=doc.splitTextToSize(T(E.nom||'École de formation'),maxW).slice(0,2); doc.text(nl,tx,ty); ty+=ns*0.40*nl.length+0.6;
  doc.setFont('helvetica','normal'); doc.setFontSize(o.small||8); doc.setTextColor(...C.mut);
  const lh=(o.small||8)*0.45;
  String(E.entete||'').split('\n').map(l=>l.trim()).filter(Boolean).slice(0,o.maxLines||4).forEach(l=>{ doc.text(doc.splitTextToSize(T(l),maxW)[0],tx,ty); ty+=lh; });
  const l2=[E.adresse,E.telephone,E.email].filter(Boolean).map(T).join('  ·  ');
  if(l2){ const ls=doc.splitTextToSize(l2,maxW).slice(0,2); doc.text(ls,tx,ty); ty+=lh*ls.length; }
  if(E.ninea){ doc.text('NINEA / RCCM : '+T(E.ninea),tx,ty); ty+=lh; }
  return Math.max(bottom, ty-lh+1.5);
}
function pdfHeader(doc, titre, sousTitre, E){
  E=E||etabFor(); ACC=hexRgb(E.couleur);
  const W=doc.internal.pageSize.getWidth();
  doc.setFillColor(...ACC); doc.rect(0,0,W,3,'F');
  const bottom=drawIdent(doc,E,15,15,W-30-64);
  doc.setTextColor(...C.ink); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(T(titre),W-15,15,{align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...C.mut);
  if(sousTitre) doc.splitTextToSize(T(sousTitre),62).forEach((l,i)=>doc.text(l,W-15,20.5+i*4,{align:'right'}));
  const ly=Math.max(bottom+3,28);
  doc.setDrawColor(...C.line); doc.setLineWidth(.3); doc.line(15,ly,W-15,ly);
  return ly+8;
}
function piedLines(doc,E,maxW){ doc.setFontSize(7.5); return String(E?.pied||'').split('\n').map(l=>l.trim()).filter(Boolean).flatMap(l=>doc.splitTextToSize(T(l),maxW)).slice(0,3); }
function pdfFooter(doc,E,generated=true){
  const n=doc.getNumberOfPages(), W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  const d=new Date(), g=`Document généré le ${fdate(today())} à ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal');
    const pl=piedLines(doc,E,W-30);
    if(pl.length){ doc.setTextColor(...C.mut); doc.setFontSize(7.5); const y0=H-11-3.4*(pl.length-1); doc.setDrawColor(...C.line); doc.setLineWidth(.2); doc.line(15,y0-4,W-15,y0-4);
      pl.forEach((l,k)=>doc.text(l,W/2,y0+3.4*k,{align:'center'})); }
    if(generated){ doc.setFontSize(7); doc.setTextColor(150); doc.text(T(g),15,H-5.5); doc.text(`Page ${i} / ${n}`,W-15,H-5.5,{align:'right'}); } }
}
function kvPdf(doc, x, y, rows, wLabel=38, wMax=120){
  doc.setFontSize(9.5);
  rows.forEach(([k,v,bold])=>{ doc.setTextColor(...C.mut); doc.setFont('helvetica','normal'); doc.text(T(k),x,y);
    doc.setTextColor(...C.ink); doc.setFont('helvetica',bold?'bold':'normal'); const lines=doc.splitTextToSize(T(v),wMax); doc.text(lines,x+wLabel,y); y+=5.6*lines.length; });
  return y;
}
const tblBase = { theme:'grid', styles:{font:'helvetica',fontSize:8.8,cellPadding:2.2,lineColor:C.line,lineWidth:.2,textColor:C.ink},
  headStyles:{fillColor:C.ink,textColor:255,fontStyle:'bold',fontSize:8.5}, footStyles:{fillColor:[238,235,228],textColor:C.ink,fontStyle:'bold'},

async function savePdf(doc, filename, E, generated=true){

function recuBlock(doc, r, y0, exemplaire){

  doc.setFontSize(7); doc.setTextColor(...col); doc.setFont('helvetica','bold'); doc.text(exemplaire,R,y0+24,{align:'right'});
  const hy=Math.max(bottom+2.5, y0+27);
  doc.setDrawColor(...C.line); doc.setLineWidth(.3); doc.line(x,hy,R,hy);

    ['Motif', p.motif+(p.note?' — '+p.note:'')],
    ['Mode de paiement', p.mode+(p.reference?'  ·  réf. '+p.reference:'')],
  ], 36, 80);
  const bx=x+122, bw=R-bx, by=hy+3;
  doc.setFillColor(...col.map(v=>Math.round(v+(255-v)*.9))); doc.setDrawColor(...col); doc.setLineWidth(.4); doc.roundedRect(bx,by,bw,20,2,2,'FD');

  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...C.inn); doc.text(pm(p.montant),bx+bw/2,by+14.5,{align:'center'});

async function pdfRapport(){ await withPdf(async()=>{

  const cons=curEtabId()==='*', E=cons?etabById(defaultEtabId())||etabFallback():etabFor();
  const doc=await newPdf(); let y=pdfHeader(doc,'RAPPORT FINANCIER',`Du ${fdate(R.rg[0])} au ${fdate(R.rg[1])}`+(cons?` — consolidé (${etabs().length} établissements)`:''),E);
  y=sectionTitle(doc,y,'Compte de résultat');
  const res=R.rec-R.dep;
  doc.autoTable({...tblBase, startY:y+1, body:[
      ['Solde de trésorerie en début de période', pmS(R.soldeInit)],
      [{content:'Total des recettes',styles:{textColor:C.inn}}, {content:'+ '+pmS(R.rec),styles:{textColor:C.inn}}],
      [{content:'Total des dépenses',styles:{textColor:C.out}}, {content:'- '+pmS(R.dep),styles:{textColor:C.out}}],
      [{content:'Résultat de la période',styles:{fontStyle:'bold'}}, {content:(res<0?'- ':'')+pmS(Math.abs(res)),styles:{fontStyle:'bold',textColor:res>=0?C.inn:C.out}}],
      [{content:'Solde de trésorerie en fin de période',styles:{fontStyle:'bold',fillColor:[238,235,228]}}, {content:pmS(R.soldeInit+res),styles:{fontStyle:'bold',fillColor:[238,235,228]}}] ],
    columnStyles:{1:{halign:'right',cellWidth:55}} });
  y=doc.lastAutoTable.finalY+9;
  const grp=(title,rows,tot,color)=>{ y=sectionTitle(doc,y,title);
    doc.autoTable({...tblBase, startY:y+1, head:[['Rubrique','Montant','%']],
      body: rows.length? rows.map(([k,v])=>[T(k),pmS(v),tot?Math.round(v/tot*100)+' %':'']) : [[{content:'Aucune donnée sur la période',colSpan:3,styles:{halign:'center',textColor:C.mut}}]],
      foot: rows.length? [['Total',pmS(tot),'100 %']] : undefined,
      columnStyles:{1:{halign:'right',cellWidth:45,textColor:color},2:{halign:'right',cellWidth:20}} });
    y=doc.lastAutoTable.finalY+9; };
  if(cons){ grp('Recettes par établissement', groupSum(R.pays,p=>etabById(etabIdOf(p))?.nom||'—'), R.rec, C.inn); grp('Dépenses par établissement', groupSum(R.deps,d=>etabById(etabIdOf(d))?.nom||'—'), R.dep, C.out); }
  grp('Recettes par formation', groupSum(R.pays, p=>{ const a=byId('apprenants',p.apprenantId); return a?(nomFormation(formationOf(a))||'Sans formation'):'Recettes diverses'; }), R.rec, C.inn);
  grp('Recettes par motif', groupSum(R.pays,'motif'), R.rec, C.inn);
  grp('Recettes par mode de paiement', groupSum(R.pays,'mode'), R.rec, C.inn);
  grp('Dépenses par catégorie', groupSum(R.deps,'categorie'), R.dep, C.out);
  // recouvrement
  const actifs=S.apprenants.filter(a=>a.statut!=='abandon'); const du=sum(actifs,montantDu), pa=sum(actifs,montantPaye);
  y=sectionTitle(doc,y,`Situation du recouvrement (au ${fdate(today())})`);
  doc.autoTable({...tblBase, startY:y+1, body:[['Montant total attendu',pmS(du)],['Montant encaissé',pmS(pa)],['Reste à recouvrer',pmS(du-pa)],['Taux de recouvrement',(du?Math.round(pa/du*100):0)+' %']],
    columnStyles:{1:{halign:'right',cellWidth:55}} });
  y=doc.lastAutoTable.finalY+9;
  // impayés
  const imp=actifs.filter(a=>reste(a)>0).sort((a,b)=>reste(b)-reste(a));
  if(imp.length){ y=sectionTitle(doc,y,`Liste des impayés (${imp.length})`);
    doc.autoTable({...tblBase, startY:y+1, head:[['Apprenant','Formation','Dû','Payé','Reste']],
      body: imp.map(a=>[T(apprenantNom(a.id))+(a.matricule?` (${T(a.matricule)})`:''),T(nomFormation(formationOf(a))||'—'),pmS(montantDu(a)),pmS(montantPaye(a)),{content:pmS(reste(a)),styles:{textColor:C.out}}]),
      foot:[['Total','',pmS(sum(imp,montantDu)),pmS(sum(imp,montantPaye)),pmS(sum(imp,reste))]],
      columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}} });
    y=doc.lastAutoTable.finalY+9; }
  // journal
  const journal=[...R.pays.map(p=>({date:p.date,lib:`${p.motif} — ${apprenantNom(p.apprenantId)||p.payeur||'Recette diverse'}`,ref:p.numero,in:+p.montant||0,out:0,t:p.majLe||''})),
                 ...R.deps.map(d=>({date:d.date,lib:[d.categorie, d.beneficiaire||d.description].filter(Boolean).join(' — '),ref:d.reference||'',in:0,out:+d.montant||0,t:d.majLe||''}))]
    .sort((a,b)=>a.date.localeCompare(b.date)||a.t.localeCompare(b.t));
  let solde=R.soldeInit;
  y=sectionTitle(doc,y,'Journal de caisse');
  doc.autoTable({...tblBase, startY:y+1, head:[['Date','Libellé','Réf.','Entrée','Sortie','Solde']],
    body:[[ '', {content:'Solde initial',styles:{textColor:C.mut}}, '', '', '', pmS(R.soldeInit)],
      ...journal.map(j=>{ solde+=j.in-j.out; return [fdate(j.date),T(j.lib),T(j.ref),j.in?{content:pmS(j.in),styles:{textColor:C.inn}}:'',j.out?{content:pmS(j.out),styles:{textColor:C.out}}:'',pmS(solde)]; })],
    foot:[['Totaux','','',pmS(R.rec),pmS(R.dep),pmS(solde)]],
    styles:{...tblBase.styles,fontSize:8}, columnStyles:{0:{cellWidth:20},2:{cellWidth:26},3:{halign:'right',cellWidth:24},4:{halign:'right',cellWidth:24},5:{halign:'right',cellWidth:26}} });
  await savePdf(doc, `Rapport_financier_${R.rg[0]}_au_${R.rg[1]}.pdf`, E);
}); }

/* ================== Supabase (version GitHub / web) ================== */
const ROLES = [['admin','Administrateur'],['caissier','Caissier'],['lecteur','Lecteur'],['en_attente','En attente']];
const roleLabel = r => (ROLES.find(x=>x[0]===r)||[r,r])[1];
function addScript(src){ return new Promise((ok,ko)=>{ const t=document.createElement('script'); t.src=src; t.onload=ok; t.onerror=()=>ko(new Error(src)); document.head.appendChild(t); }); }
async function initSupabase(){
  const recovery=/type=recovery/.test(location.hash);
  try{ if(!window.supabase) await addScript('lib/supabase.js'); }catch(e){ authScreen('erreur','Impossible de charger la bibliothèque Supabase (lib/supabase.js).'); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==='PASSWORD_RECOVERY'){ authScreen('nouveau-mdp'); return; }
    if(ev==='SIGNED_OUT'){ SB.user=null; SB.role=null; authScreen('login'); }
  });
  const { data:{ session } } = await sb.auth.getSession();
  if(recovery){ authScreen('nouveau-mdp'); return; }
  if(!session){ authScreen('login'); return; }
  await afterLogin(session.user);
}
async function afterLogin(user){
  SB.user=user;
  const { data:role, error } = await sb.rpc('fin_rejoindre', { p_nom: user.user_metadata?.nom || null });
  if(error){ authScreen('erreur', 'Accès refusé : '+error.message); return; }
  SB.role=role;
  if(role==='suspendu'){ authScreen('suspendu'); return; }
  if(!['admin','caissier','lecteur'].includes(role)){ authScreen('attente'); return; }
  canWrite = role==='admin' || role==='caissier';
  document.getElementById('authRoot').innerHTML='';
  mode='sb'; await sbLoadAll(); sbSubscribe(); render();
}
async function sbFetchAll(table, cols){
  let out=[], from=0; const step=1000;
  for(;;){ const { data, error } = await sb.from(table).select(cols).range(from, from+step-1); if(error) throw error; out=out.concat(data); if(data.length<step) break; from+=step; }
  return out;
}
async function sbLoadAll(){
  try{
    await Promise.all([...COLS,'etablissements'].map(async c=>{ const rows=await sbFetchAll(TBL(c),'id,data'); RAW[c]=rows.map(r=>({...r.data, id:r.id})); }));
    if(SB.role==='admin'){ const { data } = await sb.from('fin_membres').select('*').order('cree_le'); SB.membres=data||[]; }
  }catch(e){ toast('Erreur de chargement : '+(e.message||''),true); }
}
function sbSubscribe(){
  if(SB.channel) sb.removeChannel(SB.channel);
  let ch = sb.channel('fin-'+Math.random().toString(36).slice(2));
  [...COLS,'etablissements'].forEach(c=>{
    ch = ch.on('postgres_changes', { event:'*', schema:'public', table:TBL(c) }, pl=>{
      if(pl.eventType==='DELETE'){ const id=pl.old?.id; RAW[c]=RAW[c].filter(x=>x.id!==id); }
      else { const d={...pl.new.data, id:pl.new.id}; const i=RAW[c].findIndex(x=>x.id===d.id); if(i>=0) RAW[c][i]=d; else RAW[c].push(d); }
      schedule();
    });
  });
  ch = ch.on('postgres_changes', { event:'*', schema:'public', table:'fin_membres' }, async pl=>{
    if(pl.eventType==='DELETE' && pl.old?.user_id===SB.user?.id){ location.reload(); return; }
    if(pl.new && pl.new.user_id===SB.user?.id && (pl.new.role!==SB.role || pl.new.actif===false)){ location.reload(); return; }
    if(SB.role==='admin'){ const { data } = await sb.from('fin_membres').select('*').order('cree_le'); SB.membres=data||[]; schedule(); }
  });
  SB.channel = ch.subscribe();
}
async function sbSave(col, id, out){
  let nid = id || uidLocal();
  for(let essai=0; essai<5; essai++){
    const { error } = await sb.from(TBL(col)).upsert({ id:nid, etablissement_id: out.etablissementId||null, data: out });
    if(!error){ const d={...out, id:nid}; const i=RAW[col].findIndex(x=>x.id===nid); if(i>=0) RAW[col][i]=d; else RAW[col].push(d); render(); return nid; }
    // numéro de reçu déjà pris par un autre poste : on prend le suivant
    if(error.code==='23505' && col==='paiements' && !id && out.numero){
      const m=/^(.*?)(\d+)$/.exec(out.numero); const suiv=Math.max(m?+m[2]:0, maxSeq(out.etablissementId))+1;
      out.numero = (m?m[1]:out.numero+'_')+String(suiv).padStart(4,'0'); continue;
    }
    throw error;
  }
  throw { message:'numérotation' };
}

function genMdp(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; let p=''; const a=new Uint32Array(10); crypto.getRandomValues(a); a.forEach(v=>p+=c[v%c.length]); return p; }

function formMonMdp(){
  openModal('Mon mot de passe', `<form id="fm" onsubmit="event.preventDefault()"><label class="f">Nouveau mot de passe (8 caractères min.)${pwdInput('password','minlength="8" required autocomplete="new-password"')}</label>
    <label class="f" style="margin-top:12px">Confirmer${pwdInput('password2','minlength="8" required autocomplete="new-password"')}</label></form>`,
    `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn pri" onclick="changerMonMdp()">Enregistrer</button>`);
}
async function changerMonMdp(){
  const fm=document.getElementById('fm'); if(!fm.reportValidity()) return;
  if(fm.password.value!==fm.password2.value){ toast('Les deux mots de passe sont différents.',true); return; }
  const { error } = await sb.auth.updateUser({ password: fm.password.value });
  if(error){ toast('Échec : '+frErr(error),true); return; } closeModal(); toast('Mot de passe modifié');
}
function retirerMembre(uid){ confirmBox('Retirer l\'accès de cet utilisateur à l\'application ? (Son compte de connexion n\'est pas supprimé.)', async()=>{
  try{ await fnAdmin({action:'remove', user_id:uid}); toast('Accès retiré'); }catch(e){ toast('Échec : '+e.message,true); }
  await rechargerMembres(); }, 'Retirer'); }

/* Écrans de connexion */
function authScreen(vue, msg=''){
  const root=document.getElementById('authRoot');
  const titre = {login:'Connexion', inscription:'Créer un compte', oubli:'Mot de passe oublié', 'nouveau-mdp':'Nouveau mot de passe', attente:'Accès non autorisé', suspendu:'Compte suspendu', erreur:'Problème de connexion'}[vue];
  let body='';
  if(vue==='login') body=`<form onsubmit="event.preventDefault();doLogin(this)">
      <label class="f">E-mail<input class="input" type="email" name="email" required autocomplete="email"></label>
      <label class="f">Mot de passe${pwdInput('password','required autocomplete="current-password"')}</label>
      <div class="err" id="authErr">${esc(msg)}</div>
      <button class="btn pri" style="justify-content:center">Se connecter</button></form>
      <div class="auth-note">Besoin d'un compte ou mot de passe oublié ?<br>Contactez l'administrateur de votre organisation.</div>`;
  if(vue==='nouveau-mdp') body=`<form onsubmit="event.preventDefault();doNewPwd(this)">
      <label class="f">Nouveau mot de passe${pwdInput('password','minlength="8" required autocomplete="new-password"')}</label>
      <div class="err" id="authErr"></div>
      <button class="btn pri" style="justify-content:center">Enregistrer</button></form>`;
  if(vue==='attente') body=`<p>Le compte <b>${esc(SB.user?.email||'')}</b> n'a pas accès à l'application Finances.</p><p class="muted small">Contactez l'administrateur de votre organisation.</p>`
      +`<div class="row"><button class="btn" onclick="sbLogout()">Déconnexion</button></div>`;
  if(vue==='suspendu') body=`<p>Le compte <b>${esc(SB.user?.email||'')}</b> est <b>suspendu</b>.</p><p class="muted small">Contactez l'administrateur de votre organisation.</p>`
      +`<div class="row"><button class="btn" onclick="sbLogout()">Déconnexion</button></div>`;
  if(vue==='erreur') body=`<p style="color:var(--danger)">${esc(msg)}</p><div class="row"><button class="btn pri" onclick="location.reload()">Réessayer</button>${sb?'<button class="btn" onclick="sbLogout()">Déconnexion</button>':''}</div>`;
  root.innerHTML = `<div class="auth"><div class="auth-card"><div class="logo" style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#34d399,#0f766e);display:grid;place-items:center;font-weight:800;color:#06201b;font-size:20px">₣</div>
    <h2>${titre}</h2><div class="muted small">Finances – École de Formation</div>${body}</div></div>`;
  const f=root.querySelector('input'); if(f) setTimeout(()=>f.focus(),30);
}
const authErr = m => { const e=document.getElementById('authErr'); if(e){ e.className='err'; e.textContent=m; } };
const authOk = m => { const e=document.getElementById('authErr'); if(e){ e.className='ok'; e.textContent=m; } };
function frErr(e){ const m=(e&&e.message)||''; if(/Invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.'; if(/Email not confirmed/i.test(m)) return 'Adresse e-mail pas encore confirmée : ouvrez le lien reçu par e-mail.'; if(/already registered|already exists/i.test(m)) return 'Un compte existe déjà avec cet e-mail : connectez-vous.'; if(/Password should/i.test(m)) return 'Mot de passe trop faible (8 caractères minimum).'; if(/rate limit/i.test(m)) return 'Trop de tentatives, réessayez dans quelques minutes.'; return m||'Erreur inconnue.'; }
async function doLogin(f){ const d=Object.fromEntries(new FormData(f)); authErr('');
  const { data, error } = await sb.auth.signInWithPassword({ email:d.email.trim(), password:d.password });
  if(error){ authErr(frErr(error)); return; } await afterLogin(data.user); }
async function doNewPwd(f){ const d=Object.fromEntries(new FormData(f));
  const { data, error } = await sb.auth.updateUser({ password:d.password });
  if(error){ authErr(frErr(error)); return; } history.replaceState(null,'',location.pathname); await afterLogin(data.user); }

init();
</script>
</body>
</html>
